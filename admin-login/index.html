<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B2545">
  <meta name="description" content="Entre no espaço de gestão de acomodações ebenLiving.">
  <title>Login do anunciante | ebenLiving</title>
  <script>(function(){if(location.pathname==='/admin-login.html')location.replace('/admin-login/'+location.search+location.hash)})();</script>
  <link rel="canonical" href="https://ebenliving.com.br/admin-login/">
  <link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/brand.css"><link rel="stylesheet" href="/css/living.css">
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <header class="header"><div class="container header-inner">
    <a href="/" class="logo logo-image" aria-label="ebenLiving — início"><img src="/assets/ebenliving-logo.png" alt="ebenLiving, um produto EbenSystem" width="1448" height="1086"></a>
    <button id="themeToggle" class="btn btn-outline theme-toggle" type="button" aria-label="Ativar tema escuro" aria-pressed="false">🌙 Escuro</button>
  </div></header>
  <main class="checkout" id="main"><div class="container narrow">
    <section class="panel profile-panel">
      <span class="eyebrow">ÁREA DO ANUNCIANTE</span>
      <h1>Acesse seu espaço</h1>
      <p class="muted">Entre para administrar seus imóveis, agenda e solicitações.</p>
      <form id="authForm" data-auth-mode="login" data-redirect="/admin/">
        <div class="field"><label for="authEmail">E-mail da conta</label><input id="authEmail" name="email" type="email" autocomplete="username" required></div>
        <div class="field mt"><label for="authPassword">Senha</label><input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="6" required></div>
        <p id="authMessage" class="error" role="alert" hidden></p>
        <button class="btn btn-primary btn-large mt" type="submit">Entrar no espaço do anunciante</button>
      </form>
      <p class="small muted">Ainda não anuncia? <a class="link" href="/anuncie/">Crie sua conta de anunciante</a></p>
      <p class="small muted">É cliente? <a class="link" href="/login/">Acesse sua conta de cliente</a></p>
      <a class="link" href="/">Voltar ao início</a>
    </section>
  </div></main>
  <script type="module" src="/js/auth.js"></script><script src="/js/theme.js"></script>
</body>
</html>
