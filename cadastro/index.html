<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B2545">
  <meta name="description" content="Crie sua conta de cliente ebenLiving.">
  <title>Criar conta de cliente | ebenLiving</title>
  <script>(function(){if(location.pathname==='/cadastro.html')location.replace('/cadastro/'+location.search+location.hash)})();</script>
  <link rel="canonical" href="https://ebenliving.com.br/cadastro/">
  <link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/brand.css"><link rel="stylesheet" href="/css/living.css">
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <header class="header"><div class="container header-inner">
    <a href="/" class="logo logo-image" aria-label="ebenLiving — início"><img src="/assets/ebenliving-logo.png" alt="ebenLiving, um produto EbenSystem" width="1448" height="1086"></a>
    <button id="themeToggle" class="btn btn-outline theme-toggle" type="button" aria-label="Ativar tema escuro" aria-pressed="false">🌙 Escuro</button>
  </div></header>
  <main class="checkout" id="main"><div class="container narrow">
    <section class="panel profile-panel">
      <span class="eyebrow">ÁREA DO CLIENTE</span>
      <h1>Crie sua conta</h1>
      <p class="muted">Salve seus dados e acompanhe suas solicitações de estadia.</p>
      <form id="authForm" data-auth-mode="register" data-account-type="customer" data-redirect="/reservas">
        <div class="field"><label for="authName">Nome completo</label><input id="authName" name="name" autocomplete="name" minlength="2" maxlength="80" required></div>
        <div class="field mt"><label for="authEmail">E-mail</label><input id="authEmail" name="email" type="email" autocomplete="email" required></div>
        <div class="field mt"><label for="authPassword">Senha (mínimo 6 caracteres)</label><input id="authPassword" name="password" type="password" autocomplete="new-password" minlength="6" required></div>
        <p id="authMessage" class="error" role="alert" hidden></p>
        <button class="btn btn-primary btn-large mt" type="submit">Criar conta de cliente</button>
      </form>
      <p class="small muted">Já tem conta? <a class="link" href="/login/">Entrar</a></p>
      <p class="small muted">Para anunciar uma acomodação, <a class="link" href="/anuncie/">crie uma conta de anunciante</a>.</p>
    </section>
  </div></main>
  <script type="module" src="/js/auth.js"></script><script src="/js/theme.js"></script>
</body>
</html>
